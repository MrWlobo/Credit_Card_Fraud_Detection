[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-card-fraud-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mlflow>=2.10.0",
    "pandas<3",
    "scikit-learn>=1.3.0",
    "setuptools>=70.0.0",
    "torch>=2.0.0",
    "zenml[server]>=0.96.3",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyter",
]
